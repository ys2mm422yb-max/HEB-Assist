name: Deploy HEB Assist to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'styles.css'
      - 'dark-mode.css'
      - 'mobile-fixes.css'
      - 'bootstrap.js'
      - 'app.js'
      - 'ai-engine.js'
      - 'evidence-pipeline.js'
      - 'evidence-router.js'
      - 'privacy-filter.js'
      - 'heb-knowledge.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'package.json'
      - 'playwright.config.mjs'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node --check bootstrap.js
          node --check app.js
          node --check ai-engine.js
          node --check evidence-pipeline.js
          node --check evidence-router.js
          node --check privacy-filter.js
          node --check heb-knowledge.js
          node --check sw.js
          node --check tests/evidence-pipeline.test.mjs
          node --check tests/browser/app-shell.spec.mjs

      - name: Run synthetic evidence regression tests
        run: node tests/evidence-pipeline.test.mjs

      - name: Install browser test tooling
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Run Chromium, WebKit and mobile-layout smoke tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/heb-assist-http.log 2>&1 &
          sleep 2
          npm run test:browser

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
