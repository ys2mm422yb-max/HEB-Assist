name: Deploy HEB Assist to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'styles.css'
      - 'dark-mode.css'
      - 'mobile-fixes.css'
      - 'generation-progress.css'
      - 'bootstrap.js'
      - 'app.js'
      - 'ai-engine.js'
      - 'evidence-pipeline.js'
      - 'reasoning-pipeline.js'
      - 'privacy-filter.js'
      - 'heb-knowledge.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'package.json'
      - 'scripts/**'
      - 'playwright.config.mjs'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare local Transformers.js runtime
        run: npm run build:runtime

      - name: Check JavaScript syntax
        run: |
          node --check bootstrap.js
          node --check app.js
          node --check ai-engine.js
          node --check evidence-pipeline.js
          node --check reasoning-pipeline.js
          node --check privacy-filter.js
          node --check heb-knowledge.js
          node --check sw.js
          node --check scripts/build-runtime.mjs
          node --check tests/evidence-pipeline.test.mjs
          node --check tests/reasoning-pipeline.test.mjs
          node --check tests/browser/app-shell.spec.mjs

      - name: Check v12 local-runtime architecture
        run: |
          grep -q "onnx-community/Qwen3.5-0.8B-ONNX" ai-engine.js
          grep -q "7126260ed8e5acbe7b5d0b84bbec84df50b63a87" ai-engine.js
          grep -q "pipeline('text-generation'" ai-engine.js
          grep -q "embed_tokens: MODEL_DTYPE" ai-engine.js
          grep -q "decoder_model_merged: MODEL_DTYPE" ai-engine.js
          grep -q "PREVIOUS_START_INCOMPLETE" ai-engine.js
          grep -q "./vendor/transformers.js" ai-engine.js
          grep -q "from './ai-engine.js';" app.js
          grep -q "await import('./ai-engine.js')" bootstrap.js
          if grep -nE "ai-engine\.js\?build|ai-engine\.js\?" bootstrap.js app.js; then
            echo "ai-engine.js darf nicht unter mehreren Modul-URLs geladen werden; sonst entstehen getrennte KI-Zustände."
            exit 1
          fi
          test -s vendor/transformers.js
          test -s vendor/ort-wasm-simd-threaded.jsep.mjs
          test -s vendor/ort-wasm-simd-threaded.jsep.wasm
          if grep -R -nE "esm\.run|cdn\.jsdelivr\.net|unpkg\.com" --include='*.js' --include='*.html' . --exclude-dir=node_modules --exclude-dir=vendor; then
            echo "Externe JavaScript-CDN in App-Code gefunden."
            exit 1
          fi
          if grep -R -n "gemma-3-1b-it-ONNX" --include='*.js' --include='*.html' . --exclude-dir=node_modules --exclude-dir=vendor; then
            echo "Nicht mehr zulässiges Gemma-3-1B-Modell im App-Code gefunden."
            exit 1
          fi
          if grep -R -n "Qwen3-1.7B-q4f16_1-MLC" --include='*.js' --include='*.html' . --exclude-dir=node_modules --exclude-dir=vendor; then
            echo "Nicht mehr zulässiges 1.7B-WebLLM-Modell im App-Code gefunden."
            exit 1
          fi

      - name: Run synthetic evidence regression tests
        run: node tests/evidence-pipeline.test.mjs

      - name: Run synthetic reasoning-safety regression tests
        run: node tests/reasoning-pipeline.test.mjs

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run Chromium, WebKit and mobile-layout smoke tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/heb-assist-http.log 2>&1 &
          sleep 2
          npm run test:browser

      - name: Prepare static Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/vendor
          cp index.html styles.css dark-mode.css mobile-fixes.css generation-progress.css _site/
          cp bootstrap.js app.js ai-engine.js evidence-pipeline.js reasoning-pipeline.js privacy-filter.js heb-knowledge.js _site/
          cp manifest.webmanifest icon.svg sw.js _site/
          cp vendor/transformers.js _site/vendor/
          cp vendor/ort-wasm-simd-threaded.jsep.mjs _site/vendor/
          cp vendor/ort-wasm-simd-threaded.jsep.wasm _site/vendor/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
