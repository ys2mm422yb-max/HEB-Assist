name: Deploy HEB Assist to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'styles.css'
      - 'dark-mode.css'
      - 'bootstrap.js'
      - 'app.js'
      - 'ai-engine.js'
      - 'evidence-pipeline.js'
      - 'privacy-filter.js'
      - 'heb-knowledge.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check bootstrap.js
          node --check app.js
          node --check ai-engine.js
          node --check evidence-pipeline.js
          node --check privacy-filter.js
          node --check heb-knowledge.js
          node --check sw.js

      - name: Run synthetic evidence regression tests
        run: node tests/evidence-pipeline.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
